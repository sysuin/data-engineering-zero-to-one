# raw.ledger_gl_revenue: finance's revenue journal for a closed month.
table: ledger.gl_revenue
version: 1
description: >
  One row per journal line posted to sales revenue in a closed
  month, by region, as finance exported it.
producer:
  who: finance (the general ledger, at month end)
  contact: finance-close@meridian.example
owner: data engineering (Groundwork ingest)
grain: one row per journal line
key: [period, region, description]
formats:
  ledger: [period, entity, region, gl_account, gl_name, description,
           amount]
columns:
  period: {pattern: '20[0-9]{2}-[01][0-9]'}
  entity: {allowed: [MERIDIAN-US]}
  region: {allowed: [NE, SE, MW, SW, WE]}
  gl_account: {allowed: ['4000']}
  gl_name: {}
  description: {}
  amount: {type: decimal, scale: 2, unit: USD}
policy:
  bad_rows: fail            # a journal is booked whole or not at all
changes:
  - version: 1
    note: first written
