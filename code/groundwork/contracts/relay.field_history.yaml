# raw.relay_field_history: the CRM's audit of changed fields.
table: relay.field_history
version: 1
description: >
  One row per change Relay recorded to an account or contract field,
  from its monthly audit files.
producer:
  who: Relay, the CRM (sales operations)
  contact: sales-ops@meridian.example
owner: data engineering (Groundwork ingest)
grain: one row per recorded change
formats:
  relay: [changed_at, object, record_id, field, old_value, new_value,
          changed_by]
columns:
  changed_at: {type: timestamp, format: '%Y-%m-%dT%H:%M:%SZ', unit: UTC}
  object: {allowed: [account, contract]}
  record_id: {type: integer, min: 1}
  field: {}
  old_value: {nullable: true}
  new_value: {nullable: true}
  changed_by: {}
policy:
  bad_rows: quarantine
  max_bad_share: 0.05
changes:
  - version: 1
    note: first written
